name: Export Analyzed GZF
on: [workflow_dispatch]

jobs:
  analyze-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Ghidra (11.2.1, asset resolved via API)
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_11.2.1_build"
          URL=$(curl -sL "$API" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.zip')))")
          echo "Downloading $URL"
          curl -sL -o ghidra.zip "$URL"
          unzip -q ghidra.zip
          ls -d ghidra_*

      - name: Create scripts
        run: |
          mkdir -p scripts
          cat << 'EOF' > scripts/ExportGZF.java
          import java.io.File;
          import ghidra.app.script.GhidraScript;

          public class ExportGZF extends GhidraScript {
              @Override
              public void run() throws Exception {
                  File out = new File("eboot.gzf");
                  currentProgram.getDomainFile().packFile(out, monitor);
                  println("Saved analyzed GZF to: " + out.getAbsolutePath());
              }
          }
          EOF

          cat << 'EOF' > scripts/DumpPause.java
          import ghidra.app.script.GhidraScript;
          import ghidra.app.decompiler.*;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.mem.Memory;
          import ghidra.program.model.symbol.*;
          import java.io.*;
          import java.nio.charset.StandardCharsets;

          public class DumpPause extends GhidraScript {
              @Override
              public void run() throws Exception {
                  String[] names = {"gam_btn_resume","gam_btn_retry","gam_btn_option",
                                    "gam_btn_back","gam_add_main_base"};
                  StringBuilder sb = new StringBuilder();
                  DecompInterface di = new DecompInterface();
                  di.openProgram(currentProgram);
                  FunctionManager fm = currentProgram.getFunctionManager();
                  ReferenceManager rm = currentProgram.getReferenceManager();
                  Memory mem = currentProgram.getMemory();

                  for (String n : names) {
                      sb.append("\n========== ").append(n).append(" ==========\n");
                      Address a = mem.findBytes(currentProgram.getMinAddress(),
                              n.getBytes(StandardCharsets.US_ASCII), null, true, monitor);
                      if (a == null) { sb.append("  (string not found)\n"); continue; }
                      sb.append("  string at ").append(a).append("\n");
                      int dumped = 0;
                      for (Reference r : rm.getReferencesTo(a)) {
                          Address from = r.getFromAddress();
                          Function f = fm.getFunctionContaining(from);
                          sb.append("  ref from ").append(from)
                            .append(f != null ? " in " + f.getName() : " (no function)").append("\n");
                          if (f != null && dumped < 3) {
                              dumped++;
                              DecompResults dr = di.decompileFunction(f, 60, monitor);
                              if (dr != null && dr.decompileCompleted())
                                  sb.append(dr.getDecompiledFunction().getC());
                          }
                      }
                  }
                  File out = new File("pause_report.txt");
                  try (Writer w = new OutputStreamWriter(new FileOutputStream(out), StandardCharsets.UTF_8)) {
                      w.write(sb.toString());
                  }
                  println(sb.toString());
                  println("wrote " + out.getAbsolutePath());
              }
          }
          EOF

      - name: Analyze + dump
        run: |
          set -euo pipefail
          GHIDRA_DIR=$(ls -d ghidra_*/ | head -1)
          mkdir -p ghidra_proj
          "$GHIDRA_DIR/support/analyzeHeadless" ghidra_proj PS4FT \
            -import ./eboot_rebuilt.elf \
            -processor x86:LE:64:default \
            -analysisTimeoutPerFile 3600 \
            -scriptPath ./scripts \
            -postScript DumpPause.java \
            -postScript ExportGZF.java \
            -max-memory 8G

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analyzed-eboot
          path: |
            eboot.gzf
            pause_report.txt
