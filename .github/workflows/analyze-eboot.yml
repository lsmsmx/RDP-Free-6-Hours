name: Export Analyzed GZF
on: [workflow_dispatch]

jobs:
  analyze-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Ghidra (11.2.1, direct URL)
        run: |
          set -euo pipefail
          curl -sSL -o ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip"
          unzip -q ghidra.zip
          ls -d ghidra_11.2.1_PUBLIC

      - name: Create scripts
        run: |
          mkdir -p scripts
          cat << 'EOF' > scripts/ExportGZF.java
          import java.io.File;
          import ghidra.app.script.GhidraScript;

          public class ExportGZF extends GhidraScript {
              @Override
              public void run() throws Exception {
                  try {
                      File out = new File(System.getProperty("user.dir"), "eboot.gzf");
                      currentProgram.getDomainFile().packFile(out, monitor);
                      println("Saved analyzed GZF to: " + out.getAbsolutePath()
                              + " size=" + out.length());
                  } catch (Throwable t) {
                      println("EXPORTGZF FAILED: " + t);
                      t.printStackTrace();
                  }
              }
          }
          EOF

          cat << 'EOF' > scripts/DumpPause.java
          import ghidra.app.script.GhidraScript;
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.program.model.address.Address;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionManager;
          import ghidra.program.model.listing.Instruction;
          import ghidra.program.model.listing.Listing;
          import ghidra.program.model.mem.Memory;
          import ghidra.program.model.symbol.Reference;
          import ghidra.program.model.symbol.ReferenceManager;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStreamWriter;
          import java.io.Writer;
          import java.nio.charset.StandardCharsets;

          public class DumpPause extends GhidraScript {
              @Override
              public void run() throws Exception {
                  String[] names = {"gam_btn_resume","gam_btn_retry","gam_btn_option",
                                    "gam_btn_back","gam_add_main_base"};
                  StringBuilder sb = new StringBuilder();
                  DecompInterface di = new DecompInterface();
                  di.openProgram(currentProgram);
                  FunctionManager fm = currentProgram.getFunctionManager();
                  ReferenceManager rm = currentProgram.getReferenceManager();
                  Memory mem = currentProgram.getMemory();
                  Listing lst = currentProgram.getListing();

                  for (String n : names) {
                      sb.append("\n========== ").append(n).append(" ==========\n");
                      Address a = mem.findBytes(currentProgram.getMinAddress(),
                              n.getBytes(StandardCharsets.US_ASCII), null, true, monitor);
                      if (a == null) { sb.append("  (string not found)\n"); continue; }
                      sb.append("  string at ").append(a).append("\n");
                      int dumped = 0;
                      for (Reference r : rm.getReferencesTo(a)) {
                          Address from = r.getFromAddress();
                          Function f = fm.getFunctionContaining(from);
                          sb.append("  ref from ").append(from)
                            .append(f != null ? " in " + f.getName() : " (no function)").append("\n");

                          Instruction ins = lst.getInstructionAt(from);
                          for (int k = 0; k < 14 && ins != null; k++) {
                              sb.append("      ").append(ins.toString()).append("\n");
                              ins = ins.getNext();
                          }

                          if (f != null && dumped < 3) {
                              dumped++;
                              try {
                                  DecompileResults dr = di.decompileFunction(f, 120, monitor);
                                  if (dr != null && dr.decompileCompleted()) {
                                      sb.append(dr.getDecompiledFunction().getC());
                                  } else {
                                      sb.append("  (decompile did not complete)\n");
                                  }
                              } catch (Exception e) {
                                  sb.append("  (decompile failed: ").append(e).append(")\n");
                              }
                          }
                      }
                  }
                  File out = new File("pause_report.txt");
                  try (Writer w = new OutputStreamWriter(new FileOutputStream(out), StandardCharsets.UTF_8)) {
                      w.write(sb.toString());
                  }
                  println(sb.toString());
                  println("wrote " + out.getAbsolutePath());
              }
          }
          EOF

      - name: Create PS4 dump script
        run: |
          cat << 'EOF' > scripts/DumpPS4.java
          import ghidra.app.script.GhidraScript;
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.program.model.address.Address;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionManager;
          import ghidra.program.model.mem.Memory;
          import ghidra.program.model.symbol.Reference;
          import ghidra.program.model.symbol.ReferenceManager;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStreamWriter;
          import java.io.Writer;
          import java.nio.charset.StandardCharsets;

          public class DumpPS4 extends GhidraScript {
              private static final long[] ADDRS = {
                  0xbb3898L, 0xbb38a0L, 0xbb38a8L, 0xbb38b0L,
                  0xbb38b8L, 0xbb38c0L, 0xbb38c8L, 0xbb38d0L,
                  0xbb38d8L, 0x005268f0L, 0x00146880L, 0x008c7044L
              };

              private void dumpFunc(StringBuilder sb, DecompInterface di, FunctionManager fm,
                                    Address from, String label) {
                  Function f = fm.getFunctionContaining(from);
                  sb.append("  ").append(label).append(" @ ").append(from);
                  if (f == null) { sb.append(" (no function)\n"); return; }
                  sb.append(" in ").append(f.getName()).append(" ").append(f.getEntryPoint()).append("\n");
                  try {
                      DecompileResults dr = di.decompileFunction(f, 120, monitor);
                      if (dr != null && dr.decompileCompleted())
                          sb.append(dr.getDecompiledFunction().getC());
                      else
                          sb.append("   (decompile did not complete)\n");
                  } catch (Exception e) {
                      sb.append("   (decompile failed: ").append(e).append(")\n");
                  }
              }

              @Override
              public void run() throws Exception {
                  StringBuilder sb = new StringBuilder();
                  DecompInterface di = new DecompInterface();
                  di.openProgram(currentProgram);
                  FunctionManager fm = currentProgram.getFunctionManager();
                  ReferenceManager rm = currentProgram.getReferenceManager();
                  Memory mem = currentProgram.getMemory();

                  sb.append("===== table / action dump =====\n");
                  for (int i = 0; i < 8; i++) {
                      Address a = toAddr(0xbb3898L + i * 8);
                      long v = 0;
                      try { v = mem.getLong(a); } catch (Exception e) { }
                      sb.append(String.format("  [0xbb3898+%d] = %08x\n", i * 8, v));
                  }
                  for (int i = 0; i < 8; i++) {
                      Address a = toAddr(0x008c7044L + i * 4);
                      int v = 0;
                      try { v = mem.getInt(a); } catch (Exception e) { }
                      sb.append(String.format("  action[%d] @008c7044 = %d\n", i, v));
                  }

                  for (long t : ADDRS) {
                      Address a = toAddr(t);
                      sb.append("\n===== xrefs to ").append(a).append(" =====\n");
                      boolean any = false;
                      try {
                          for (Reference r : rm.getReferencesTo(a)) {
                              any = true;
                              dumpFunc(sb, di, fm, r.getFromAddress(), r.getReferenceType().toString());
                          }
                      } catch (Exception e) {
                          sb.append("  (xref failed: ").append(e).append(")\n");
                      }
                      if (!any) sb.append("  (no references)\n");
                  }

                  File out = new File("ps4_report.txt");
                  try (Writer w = new OutputStreamWriter(new FileOutputStream(out), StandardCharsets.UTF_8)) {
                      w.write(sb.toString());
                  }
                  println(sb.toString());
                  println("wrote " + out.getAbsolutePath());
              }
          }
          EOF

      - name: Analyze + dump
        run: |
          set -euo pipefail
          GHIDRA_DIR=$(ls -d ghidra_*/ | head -1)
          mkdir -p ghidra_proj
          "$GHIDRA_DIR/support/analyzeHeadless" ghidra_proj PS4FT \
            -import ./eboot_rebuilt.elf \
            -processor x86:LE:64:default \
            -cspec gcc \
            -analysisTimeoutPerFile 3600 \
            -scriptPath ./scripts \
            -postScript ExportGZF.java \
            -postScript DumpPause.java \
            -postScript DumpPS4.java \
            -max-memory 8G

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzed-eboot
          path: |
            eboot.gzf
            pause_report.txt
            ps4_report.txt
            ghidra_proj/**
